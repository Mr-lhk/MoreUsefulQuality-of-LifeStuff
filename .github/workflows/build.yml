name: NeoForge 1.21.1 CI & Release

# Workflow Triggers
on:
  # Push to development / stable branches
  push:
    branches:
      - main
      - develop

    # Create a GitHub Release only when pushing a v* tag
    tags:
      - "v*"

  # Validate pull requests targeting main / develop
  pull_request:
    branches:
      - main
      - develop

  # Manual CI run
  # NOTE: Manual execution never creates a Release.
  workflow_dispatch:

# Concurrency
# Cancel an older CI run when a newer commit arrives on the same branch / PR / tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Job 1: Build
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Make Gradle Wrapper executable
      - name: Grant Execute Permission
        run: chmod +x gradlew

      # Build
      - name: Run Gradle Build
        run: ./gradlew build

      # Show generated files for debugging
      - name: List Build Artifacts
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs/

      # Upload JAR artifacts
      # These artifacts may be used by the Release job.
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-libs
          path: build/libs/*.jar
          retention-days: 7
          if-no-files-found: error

  # Job 2: Create GitHub Release
  release:
    name: Create GitHub Release

    # Release can only happen after a successful build.
    needs: build

    # IMPORTANT:
    # Only an actual push event creating/updating a v* tag may create a GitHub Release.
    if: >
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')

    runs-on: ubuntu-latest

    # Required by softprops/action-gh-release
    permissions:
      contents: write

    steps:
      # Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Download artifacts produced by the Build job
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-libs
          path: dist

      # Prepare release JARs
      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist-release

          find dist \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            -exec cp {} dist-release/ \;

          echo "=== Release Artifacts ==="
          ls -lah dist-release/

      # Create GitHub Release and upload JARs
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-release/*.jar

          # Do not automatically generate release notes
          generate_release_notes: false

          # Tags containing alpha / beta / rc are prereleases
          prerelease: >-
            ${{
              contains(github.ref_name, '-alpha') ||
              contains(github.ref_name, '-beta') ||
              contains(github.ref_name, '-rc')
            }}

          draft: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}