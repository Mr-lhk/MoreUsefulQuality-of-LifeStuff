name: "✨ 功能请求 / Feature Request"
description: "提出一个新的生活质量功能或改进建议。Suggest a new quality-of-life feature or improvement."
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢你的想法 / Thanks for your idea

        MuQoLS 的目标是**减少日常游玩中的摩擦**，而不是增加大量新内容或改变游戏核心平衡。请先搜索[现有 Issue](https://github.com/Mr-lhk/MoreUsefulQuality-of-LifeStuff/issues?q=is%3Aissue) 和 [Ideas 讨论](https://github.com/Mr-lhk/MoreUsefulQuality-of-LifeStuff/discussions/categories/ideas)，确认没有重复。

        MuQoLS aims to **reduce everyday friction**, not to add lots of new content or change core game balance. Please search existing issues and ideas first.
  - type: checkboxes
    id: preflight
    attributes:
      label: "提交前检查 / Pre-flight checklist"
      options:
        - label: "我已搜索现有 Issue 和 Discussions，确认没有重复。I have searched existing issues and discussions and found no duplicate."
          required: true
        - label: "这个建议符合 MuQoLS 的生活质量定位。This suggestion fits MuQoLS's quality-of-life scope."
          required: true
        - label: "我已考虑过它对原版平衡和多人游戏的影响。I have considered its impact on vanilla balance and multiplayer."
          required: true
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem or motivation"
      description: "你遇到了什么不便？为什么现有玩法不够好？What friction did you run into? Why is the current behavior insufficient?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "建议的解决方案 / Proposed solution"
      description: "描述你希望 MuQoLS 如何解决它。Describe how you would like MuQoLS to solve it."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "考虑过的替代方案 / Alternatives considered"
      description: "你试过或考虑过哪些其他做法？What other approaches have you tried or considered?"
  - type: dropdown
    id: category
    attributes:
      label: "功能类别 / Category"
      options:
        - "物品 / 方块 (Item / Block)"
        - "界面 / HUD (UI / HUD)"
        - "自动化 / 红石 (Automation / Redstone)"
        - "兼容性 (Compatibility)"
        - "配置 / 命令 (Config / Commands)"
        - "其他 (Other)"
    validations:
      required: true
  - type: textarea
    id: balance
    attributes:
      label: "对原版平衡的影响 / Impact on vanilla balance"
      description: "它会让游戏明显变简单吗？在多人服务器中是否可能被滥用？Would it make the game significantly easier? Could it be abused on multiplayer servers?"
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: "你愿意参与实现吗？/ Would you like to help implement it?"
      options:
        - "愿意提交 PR / Yes, I can open a PR"
        - "可以帮忙测试 / I can help test"
        - "暂时不能 / Not right now"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "补充信息 / Additional context"
      description: "截图、参考模组、相关链接等。Screenshots, reference mods, related links, etc."
